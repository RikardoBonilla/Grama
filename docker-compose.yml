services:
  postgres:
    image: postgres:16-alpine
    container_name: grama_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Passed to init-roles.sh so grama_user is created with the right password.
      GRAMA_DB_PASSWORD: ${GRAMA_DB_PASSWORD}
    ports:
      # Bind ONLY to localhost — never 0.0.0.0 or bare port mapping.
      # This blocks access from LAN and other Docker networks.
      - "127.0.0.1:5433:5432"
    volumes:
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./infrastructure/postgres/init-roles.sh:/docker-entrypoint-initdb.d/02_roles.sh:ro
      - grama_pg_data:/var/lib/postgresql/data
    networks:
      - grama_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # TODO GRAM-7: add grama_api service (Go backend)
  # TODO GRAM-?: add nginx service (Sprint 4, deploy)

  sonarqube:
    image: sonarqube:10-community
    container_name: grama_sonarqube
    restart: unless-stopped
    # Elasticsearch (embedded in SonarQube) needs high open-file limits.
    # On Linux VPS run once: sysctl -w vm.max_map_count=524288
    # Docker Desktop on macOS sets this automatically inside its Linux VM.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      # Bind ONLY to localhost — never expose SonarQube to the public internet.
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - grama_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  grama_pg_data:
    driver: local
  sonarqube_data:
    driver: local
  sonarqube_logs:
    driver: local
  sonarqube_extensions:
    driver: local

networks:
  grama_net:
    driver: bridge
