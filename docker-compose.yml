version: "3.9"

services:
  grama_postgres:
    image: postgres:16-alpine
    container_name: grama_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Bind solo a localhost — NUNCA exponer a 0.0.0.0 (regla de seguridad de red)
      - "127.0.0.1:5433:5432"
    volumes:
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./infrastructure/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TODO: agregar servicio backend Go en Sprint 0
  # TODO: agregar servicio nginx en Sprint 4 (deploy)

networks:
  default:
    name: grama_network
